</style></head><body>
<header><h1 id="ttl"></h1><small>Referee management</small></header>
<main id="app"></main><div id="md" hidden></div><div id="fl" hidden></div><datalist id="tl"></datalist>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={fx:[],cfg:{name:'GAA Referee Hub'}},V={v:'dash',id:null,q:'',st:''},M=null;
try{S=JSON.parse(localStorage.getItem('gaaref')||'')||S}catch(e){}
const save=()=>{try{localStorage.setItem('gaaref',JSON.stringify(S))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mm=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const secs=f=>f.clk.base+(f.clk.run?(Date.now()-f.clk.ts)/1000:0);
const sc=(f,t,per)=>{const ev=f.ev.filter(e=>!e.void&&e.team===t&&(per===undefined||e.per===per));const g=ev.filter(e=>e.type=='goal').length,p=ev.filter(e=>e.type=='point').length+2*ev.filter(e=>e.type=='two').length;return{g,p,tot:g*3+p,s:g+'-'+String(p).padStart(2,'0')}};
const ts=f=>new Date(f.date+'T'+f.time).getTime(),F=()=>S.fx.find(x=>x.id===V.id);
const COL={scheduled:'#2b6cb0',confirmed:'#1f8a4c',live:'#c62f2f',completed:'#5b6b82',postponed:'#b97d0a',cancelled:'#7d7d7d',abandoned:'#7a1f1f'};
const mins=f=>+f.time.slice(0,2)*60+ +f.time.slice(3,5),dur=f=>2*f.half+10;
const conflict=f=>S.fx.some(o=>o.id!==f.id&&o.date===f.date&&!['cancelled','postponed'].includes(o.status)&&Math.abs(mins(o)-mins(f))<dur(f));
const nm=(f,t)=>t=='H'?f.home:t=='A'?f.away:'General';
const dt=f=>new Date(f.date+'T12:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

function ask(title,fs,ok,btn='Save'){M={fs,ok};$('#md').innerHTML=`<div class="mb"><form class="mc" id="mf"><h3>${E(title)}</h3>${fs.map(f=>`<label>${E(f.l)}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o.v??o)}"${(o.v??o)==f.v?' selected':''}>${E(o.l??o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="5">${E(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}"${['home','away'].includes(f.k)?' list="tl"':''} value="${E(f.v)}">`}</label>`).join('')}<p id="er" class="er"></p><div class="rw"><button type="button" class="b" data-a="mx">Cancel</button><button class="b g">${btn}</button></div></form></div>`;$('#md').hidden=false}
const sure=(t,fn)=>ask(t,[],fn,'Confirm'),show=(t,x)=>ask(t,[{k:'x',l:'Select all and copy',t:'area',v:x}],()=>{},'Done');
document.addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
 for(const f of M.fs)if(f.req&&!String(v[f.k]||'').trim()){$('#er').textContent=f.l+' is required';return}
 const r=M.ok(v);if(r){$('#er').textContent=r;return}$('#md').hidden=true;save();render()});

const FF=['home','away','comp','age','code','date','time','venue','referee','officials','half','sb','notes'];
function fxForm(f,nw){const d=f||{age:S.cfg.age||'Adult',code:S.cfg.code||'Gaelic football',half:S.cfg.half||30,sb:S.cfg.sb||10,time:'14:00',date:new Date().toISOString().slice(0,10),referee:(S.cfg.pf&&S.cfg.pf.name)||S.cfg.ref||''};
 const L={home:'Home team',away:'Away team',comp:'Competition',age:'Age group',code:'Code',date:'Date',time:'Throw-in time',venue:'Venue and pitch',referee:'Referee',officials:'Linesmen, umpires, other officials',half:'Minutes per half',sb:'Black card sin bin (minutes)',notes:'Pre-match notes'};
 return FF.map(k=>({k,l:L[k],v:d[k],req:['home','away','date','time','half'].includes(k),t:k=='age'?'select':k=='code'?'select':k=='date'?'date':k=='time'?'time':k=='half'||k=='sb'?'number':k=='notes'?'area':'text',o:k=='age'?['U7','U9','U11','U13','U15','U17','Adult','Other']:['Gaelic football','Hurling','Other']})).concat(nw?[{k:'rep',l:'Repeat',t:'select',v:'0',o:[{v:'0',l:'Single fixture'},{v:'w4',l:'Weekly, 4 fixtures'},{v:'w8',l:'Weekly, 8 fixtures'},{v:'b3',l:'Blitz, 3 games at this venue'},{v:'b4',l:'Blitz, 4 games at this venue'}]}]:[])}
function saveFx(f,v){v.half=+v.half;v.sb=+v.sb||10;if(v.sb<1||v.sb>30)return'Sin bin must be 1 to 30 minutes';if(v.half<5||v.half>45)return'Half length must be 5 to 45 minutes';
 if(f){const ch=FF.filter(k=>String(f[k]??'')!=String(v[k]??''));if(ch.length)f.chg.push(new Date().toLocaleString('en-IE')+': changed '+ch.join(', '));Object.assign(f,v)}
 else{const r=v.rep||'0',n=r=='0'?1:+r.slice(1);delete v.rep;for(let i=0;i<n;i++){const w={...v};if(r[0]=='w'){const d=new Date(v.date+'T12:00');d.setDate(d.getDate()+7*i);w.date=iso(d)}if(r[0]=='b'){const m=mins(v)+i*(dur(v)+15);w.time=String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}const id=uid();S.fx.push({id,ref:'REF-'+w.date.replace(/-/g,'')+'-'+id.slice(-4).toUpperCase(),...w,rp:{...(S.cfg.pf||{})},status:'scheduled',ev:[],clk:{run:false,base:0,ts:0,per:0},rep:{st:'draft',notes:''},chg:[]})}}}
function addEv(f,o){const e={id:uid(),t:Math.floor(secs(f)),per:f.clk.per,void:false,audit:[],...o};f.ev.push(e);save();render();if(['black','yellow','red'].includes(e.type))flash(f,e)}

const A={
 nav:d=>{$('#md').hidden=true;V.pg=0;V.ss=0;V.v=d.v;V.id=d.i||null;render()},
 mx:()=>{$('#md').hidden=true},
 newfx:()=>ask('New fixture',fxForm(null,1),v=>saveFx(null,v)),
 edit:d=>{const f=S.fx.find(x=>x.id==d.i);ask('Edit fixture',fxForm(f),v=>saveFx(f,v))},
 dup:d=>{const f=S.fx.find(x=>x.id==d.i);ask('Duplicate fixture',fxForm(f,1),v=>saveFx(null,v),'Create copy')},
 del:d=>sure('Delete this fixture and its report? This cannot be undone.',()=>{S.fx=S.fx.filter(x=>x.id!=d.i)}),
 status:d=>{const f=S.fx.find(x=>x.id==d.i);ask('Fixture status',[{k:'s',l:'Status',t:'select',o:['scheduled','confirmed','postponed','cancelled'],v:f.status}],v=>{f.chg.push(new Date().toLocaleString('en-IE')+': status '+f.status+' to '+v.s);f.status=v.s})},
 start:d=>{$('#md').hidden=true;const f=S.fx.find(x=>x.id==d.i);if(f.status!='live'){f.status='live';f.start=Date.now();f.clk={run:true,base:0,ts:Date.now(),per:0}}V.v='live';V.id=f.id;save();render()},
 tog:()=>{const f=F(),k=f.clk;if(k.run){k.base=secs(f);k.run=false}else{if(k.per==1){k.per=2;f.s2=Date.now()}k.ts=Date.now();k.run=true}save();render()},
 endh:()=>{const f=F(),k=f.clk;sure(k.per?'End the match at full time?':'End the first half?',()=>{const t=secs(f);k.run=false;if(k.per==0){f.ht=t;k.per=1;k.base=f.half*60}else{f.ft=t;f.end=Date.now();k.per=3;k.base=t;f.status='completed'}})},
 aband:()=>{const f=F();ask('Abandon match',[{k:'x',l:'Reason',t:'area',req:1}],v=>{f.ft=secs(f);f.end=Date.now();f.clk.base=f.ft;f.clk.run=false;f.clk.per=3;f.status='abandoned';f.ev.push({id:uid(),t:Math.floor(f.ft),per:2,void:false,audit:[],team:'',type:'abandon',text:v.x})},'Abandon')},
